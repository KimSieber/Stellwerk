# SFTP-Server nur für die automatischen Tests von Stellwerk (v0.7.2) – nicht Teil der App.
# Eigenes Projekt mit eigener Cargo.lock: russh lässt sich nicht zusammen mit `smb`
# (Samba) bauen, weil beide verschiedene Vorabversionen derselben Kryptobibliotheken
# festlegen. Die Tests bauen und starten dieses Programm selbst.
[package]
name = "sftp-testserver"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
rand = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "io-util", "io-std", "sync", "macros"] }
