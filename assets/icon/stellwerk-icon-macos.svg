<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- macOS-Fassung: Apple-Icon-Raster, Kachel 824×824 mittig, Rest transparent -->
<g transform="translate(100 100) scale(0.8046875)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24476F"/>
      <stop offset="1" stop-color="#0E1B2C"/>
    </linearGradient>
    <linearGradient id="rail" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1024">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B9C9DC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5CFF9A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5CFF9A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>

  <!-- Hintergrund -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- Schwellen -->
  <g stroke="#5A7596" stroke-width="22" stroke-linecap="round">
    <line x1="560" y1="880" x2="720" y2="880"/>
    <line x1="560" y1="800" x2="720" y2="800"/>
    <line x1="560" y1="720" x2="720" y2="720"/>
  </g>

  <!-- Gleise (Doppelschiene durch Überzeichnen) -->
  <g fill="none" stroke-linecap="butt" clip-path="url(#c)">
    <!-- Abzweig nach links -->
    <path d="M640 1100 L640 640 C640 470 520 380 330 300 L-50 150" stroke="url(#rail)" stroke-width="120"/>
    <!-- Stammgleis geradeaus -->
    <path d="M640 1100 L640 -80" stroke="url(#rail)" stroke-width="120"/>
    <path d="M640 1100 L640 640 C640 470 520 380 330 300 L-50 150" stroke="#16304D" stroke-width="56"/>
    <path d="M640 1100 L640 -80" stroke="#16304D" stroke-width="56"/>
  </g>

  <!-- Signal -->
  <rect x="238" y="560" width="22" height="300" rx="11" fill="#5A7596"/>
  <rect x="180" y="420" width="138" height="250" rx="69" fill="#0A1420" stroke="#3B5577" stroke-width="10"/>
  <circle cx="249" cy="490" r="38" fill="#3A1C22"/>
  <circle cx="249" cy="600" r="110" fill="url(#glow)"/>
  <circle cx="249" cy="600" r="40" fill="#5CFF9A"/>
</g>
</svg>
