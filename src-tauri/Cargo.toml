[package]
name = "stellwerk"
description = "Stellwerk – kontrollierte Transportstrecken für Dateien"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# Tauri-2-Konvention: Logik in der Bibliothek, main.rs ruft nur run() auf
name = "stellwerk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
stellwerk-core.workspace = true

# Echter Schlüsselbund nur auf macOS; anderswo (z. B. Linux-Tests) ein Speicher-Tresor
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
# Mock-Laufzeit: Befehle werden in Tests über die echte IPC-Schicht aufgerufen
tauri = { version = "2", features = ["test"] }
tempfile.workspace = true
stellwerk-testserver = { path = "../crates/stellwerk-testserver" }
# Nur für examples/ftps_diagnose.rs: FTP-Befehle mitschreiben
log = "0.4"
