[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]
# Eigenes Projekt (eigene Cargo.lock), nur für Tests – siehe dort
exclude = ["werkzeuge/sftp-testserver"]

[workspace.package]
version = "0.7.1"
edition = "2021"
license = "MIT"
authors = ["Kim Sieber"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
unicode-normalization = "0.1"
dirs = "6"
tempfile = "3"
ignore = "0.4"
walkdir = "2"
blake3 = "1"
filetime = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
# FTPS: synchron mit rustls (ring), Zertifikate über die Prüfung des Betriebssystems
suppaftp = { version = "12", default-features = false, features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
sha2 = "0.10"
# SFTP (v0.7.2): libssh2, synchron; OpenSSL wird mitgebaut (keine Installation nötig)
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
# SMB: reines Rust, synchrone Variante (v0.7.1)
smb = { version = "0.12", default-features = false, features = ["multi_threaded", "sign", "encrypt"] }
stellwerk-core = { path = "crates/stellwerk-core" }
