[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "UNLICENSED"
authors = ["Kim Sieber"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
unicode-normalization = "0.1"
dirs = "6"
tempfile = "3"
ignore = "0.4"
walkdir = "2"
blake3 = "1"
filetime = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
stellwerk-core = { path = "crates/stellwerk-core" }
